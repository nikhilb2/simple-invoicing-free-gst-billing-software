name: Playwright E2E

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Full Playwright suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/e2e
      SECRET_KEY: at-least-32-characters-long-test-key
      E2E_BASE_URL: http://127.0.0.1:5173
      API_PROXY_TARGET: http://127.0.0.1:8000
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise database and seed test account
        working-directory: backend
        run: |
          python -c "import app_main"
          python seed_admin.py
          python seed_demo.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app_main:app --host 0.0.0.0 --port 8000 > /tmp/e2e-backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/docs > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/e2e-backend.log
          echo "Backend did not become ready"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/e2e-frontend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/e2e-frontend.log
          echo "Frontend did not become ready"
          exit 1

      - name: Run the full E2E suite without retries
        working-directory: frontend
        run: npx playwright test --retries=0 --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/e2e-backend.log
            /tmp/e2e-frontend.log
          if-no-files-found: ignore
          retention-days: 14
